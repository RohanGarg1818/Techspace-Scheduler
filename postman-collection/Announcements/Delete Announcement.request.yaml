$kind: http-request
description: Permanently delete an announcement and all its comments (creator or OB). Uses announcementId. Clears announcementId after success.
url: "{{baseUrl}}/announcements/{{announcementId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 204) {
          pm.collectionVariables.set('announcementId', '');
          console.log('Announcement deleted, announcementId cleared');
      }
    language: text/javascript
order: 15000
