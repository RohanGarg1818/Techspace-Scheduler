$kind: http-request
description: Team lead tries to post announcement for a team they don't lead - should return 403 FORBIDDEN. Login as priyanshu, use Design Club teamId.
url: "{{baseUrl}}/announcements"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "teamId": "{{teamId}}",
      "title": "Sneaky Team Announcement",
      "content": "Should not be allowed"
    }
order: 11000
