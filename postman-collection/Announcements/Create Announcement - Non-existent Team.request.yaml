$kind: http-request
description: Create announcement for a teamId that doesn't exist - should return 404 NOT_FOUND
url: "{{baseUrl}}/announcements"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "teamId": "00000000-0000-0000-0000-000000000000",
      "title": "Ghost Team Announcement",
      "content": "Team doesn't exist"
    }
order: 8000
