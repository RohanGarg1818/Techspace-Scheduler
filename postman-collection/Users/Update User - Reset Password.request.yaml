$kind: http-request
description: OB resets another user's password. Uses userId variable.
url: "{{baseUrl}}/users/{{userId}}"
method: PATCH
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "password": "newpassword456"
    }
order: 16000
