$kind: http-request
description: "Change password for current user. Returns 204 on success. Note: Server restarts will reset password back to default."
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "newpassword456"
    }
order: 7000
