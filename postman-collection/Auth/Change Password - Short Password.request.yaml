$kind: http-request
description: Test with password less than 8 characters - should return 400
url: "{{baseUrl}}/auth/change-password"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "currentPassword": "password123",
      "newPassword": "short"
    }
order: 9000
