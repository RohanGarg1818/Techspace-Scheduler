$kind: http-request
description: Add or update a user's position in a team (OB only). Uses teamId and userId variables.
url: "{{baseUrl}}/teams/{{teamId}}/members/{{userId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "position": "member"
    }
order: 12000
