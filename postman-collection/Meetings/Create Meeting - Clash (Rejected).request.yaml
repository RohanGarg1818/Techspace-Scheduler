$kind: http-request
description: Create a meeting that overlaps an existing one - should return 409 MEETING_CLASH. Create the OB meeting first.
url: "{{baseUrl}}/meetings"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "topic": "Clashing Meeting",
      "date": "2026-11-20",
      "startTime": "15:30",
      "endTime": "16:30"
    }
order: 15000
