$kind: http-request
description: Update meeting to clashing time and force it with ?acknowledgeClash=true. Uses meetingId.
url: "{{baseUrl}}/meetings/{{meetingId}}?acknowledgeClash=true"
method: PATCH
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "date": "2026-11-20",
      "startTime": "15:00",
      "endTime": "16:00"
    }
order: 23000
