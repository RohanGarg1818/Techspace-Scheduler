$kind: http-request
description: Team lead tries to create meeting for a team they don't lead - should return 403 FORBIDDEN. Login as priyanshu (Tech Team lead) and use Design Club's teamId.
url: "{{baseUrl}}/meetings"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "teamId": "{{teamId}}",
      "topic": "Unauthorized Team Meeting",
      "date": "2026-12-01",
      "startTime": "10:00",
      "endTime": "11:00"
    }
order: 17000
